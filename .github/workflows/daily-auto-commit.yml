name: Daily Automated Commit

on:
  schedule:
    # Runs every day at 02:30 UTC (specific hour & minute)
    - cron: "30 2 * * *"
  workflow_dispatch:   # allows manual trigger

permissions:
  contents: write  # ensure the workflow can push

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily-log - 24f3003935@ds.study.iitm.ac.in
        run: |
          echo "Automated update on $(date -u)" >> daily-log.txt

      - name: Commit the change - 24f3003935@ds.study.iitm.ac.in
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add daily-log.txt
          git commit -m "Daily automated commit" || echo "Nothing to commit"
          git pull --rebase --autostash
          git push
